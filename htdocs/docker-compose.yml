services:
  web:
    image: php:8.2-apache
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./apache-public.conf:/etc/apache2/conf-enabled/z-public.conf
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html
    command: >
      bash -c "
        a2enmod rewrite &&
        docker-php-ext-install pdo pdo_mysql mysqli &&
        apache2-foreground
      "

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: proyecto_dual
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./install.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root

volumes:
  db_data:

